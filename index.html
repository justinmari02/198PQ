<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Quiz Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-3xl mx-auto px-4 py-5">
            <h1 class="text-xl font-bold text-blue-400">Practice Quiz Hub</h1>
            <p class="text-xs text-slate-400 mt-1">Pick a subject to start reviewing</p>
        </div>
    </header>

    <main class="flex-grow max-w-3xl w-full mx-auto p-4 md:p-6">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

            <a href="diodes/" class="block bg-white p-5 rounded-xl shadow-sm border border-slate-200 hover:border-blue-400 hover:shadow-md transition-all">
                <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full uppercase">30 Items</span>
                <h2 class="text-lg font-semibold text-slate-800 mt-3">Diodes</h2>
                <p class="text-sm text-slate-500 mt-1">Semiconductor theory, PN junctions, rectifiers &amp; filters.</p>
            </a>

            <a href="magnetism/" class="block bg-white p-5 rounded-xl shadow-sm border border-slate-200 hover:border-blue-400 hover:shadow-md transition-all">
                <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full uppercase">Diagnostic Exam</span>
                <h2 class="text-lg font-semibold text-slate-800 mt-3">Magnetism</h2>
                <p class="text-sm text-slate-500 mt-1">Diagnostic practice quiz.</p>
            </a>

            <a href="magnetism-pq1/" class="block bg-white p-5 rounded-xl shadow-sm border border-slate-200 hover:border-blue-400 hover:shadow-md transition-all">
                <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full uppercase">30 Items</span>
                <h2 class="text-lg font-semibold text-slate-800 mt-3">Magnetism</h2>
                <p class="text-sm text-slate-500 mt-1">Practice quiz 1.</p>
            </a>


            <!--
                To add a new subject later:
                1. Upload its files into a new folder at the repo root (e.g. "capacitors/index.html")
                2. Copy one of the <a> blocks above, change the href to match the folder name,
                   and update the title/description text.
            -->

        </div>
    </main>

    <footer class="text-slate-400 text-xs py-4 text-center">
        Practice quizzes for review purposes only.
    </footer>
</body>
</html>
